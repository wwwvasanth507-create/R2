version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: media_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: media_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: media_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: media_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres_secure_pass@postgres:5432/media_platform?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_LOGICAL_QUOTA_BYTES: 8589934592
      STORAGE_CHUNK_SIZE_BYTES: 268435456
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: media_web
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: media_admin
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3001:3001"

volumes:
  pgdata:
  redisdata:
