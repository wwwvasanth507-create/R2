global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "backend_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:4000"]

  - job_name: "nginx_gateway"
    static_configs:
      - targets: ["nginx:80"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
